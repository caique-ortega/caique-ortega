name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: caique-ortega
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#168BFF&color_dots=#EAF6FF,#B7E9FF,#72CEFF,#168BFF,#0B5DBB
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#46D9FF&color_dots=#07111F,#0B2A42,#0B4F79,#168BFF,#46D9FF

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 Update snake animation automatically"
          committer: Caique Ortega <caique.ortega.dev@gmail.com>
          author: Caique Ortega <caique.ortega.dev@gmail.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
